# fly.toml app configuration file for project-whatseasy-morning-frost-4625
# WhatsEasy 2.0 - Production Fly.io Configuration

app = 'project-whatseasy-morning-frost-4625'
primary_region = 'gru'

[build]

[env]
  PORT = '3000'
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  DATABASE_URL = 'file:///data/dev.db'
  AUTHS_DIR = '/data/auths'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '3gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
